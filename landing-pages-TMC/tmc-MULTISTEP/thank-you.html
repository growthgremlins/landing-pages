<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/webp" href="./tmc-logo.webp">
  <link rel="shortcut icon" type="image/webp" href="./tmc-logo.webp">
  <link rel="apple-touch-icon" href="./tmc-logo.webp">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16828382025"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-16828382025', {
      'conversion_linker': true,
      'allow_enhanced_conversions': true
    });
  </script>

  <!-- Event snippet for FORM SUBMIT(multi-step) conversion page.
       tid       - minted on the form page and carried in the URL, so a reload or a
                   back-forward re-fires the same id. The conversion action is set to
                   Count: Every, so without this every refresh counted again.
       user_data - stashed by the form page; gtag hashes it with SHA-256 before it
                   leaves the browser. Ads reports 0% enhanced-conversion coverage
                   today because Automatic mode finds no fields to scrape here. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);

      // user_data has to be set BEFORE the conversion event.
      try {
        var ud = JSON.parse(sessionStorage.getItem('lead_ud') || 'null');
        if (ud && (ud.phone_number || ud.email)) {
          var clean = {};
          if (ud.phone_number) clean.phone_number = ud.phone_number;
          if (ud.email) clean.email = ud.email;
          gtag('set', 'user_data', clean);
        }
        sessionStorage.removeItem('lead_ud');
      } catch (e) {}

      var ev = {
        'send_to': 'AW-16828382025/J8drCO2E9YIdEMn2stg-',
        'value': 1.0,
        'currency': 'USD'
      };
      var tid = p.get('tid');
      if (tid) ev.transaction_id = tid;
      gtag('event', 'conversion', ev);
    })();
  </script>

  <!-- Funnel analytics: one thank_you_view row under the form page's session.
       ANALYTICS_URL must match the one in index.html; empty = off. -->
  <script>
    (function () {
      var ANALYTICS_URL = '';
      if (!ANALYTICS_URL) return;
      var p = new URLSearchParams(location.search), sid = '';
      try { sid = sessionStorage.getItem('trk_sid') || ''; } catch (e) {}
      var vw = window.innerWidth;
      var body = JSON.stringify({
        ctx: {
          session_id: sid || 'no-session', device: vw < 768 ? 'mobile' : (vw < 1280 ? 'tablet' : 'desktop'),
          viewport_w: vw, gclid: p.get('gclid') || '', utm_source: p.get('utm_source') || '',
          utm_medium: p.get('utm_medium') || '', utm_campaign: p.get('utm_campaign') || '',
          utm_term: p.get('utm_term') || '', utm_content: p.get('utm_content') || '',
          loc: '', referrer: document.referrer || '', landing_url: location.href
        },
        events: [{ e: 'thank_you_view', ts: new Date().toISOString(), step: '', target: '',
                   detail: '', entry: '', max_step: '', secs: 0, tid: p.get('tid') || '' }]
      });
      try {
        if (!navigator.sendBeacon(ANALYTICS_URL, new Blob([body], { type: 'text/plain;charset=UTF-8' }))) throw 0;
      } catch (e) {
        try { fetch(ANALYTICS_URL, { method: 'POST', mode: 'no-cors', keepalive: true, body: body }); } catch (e2) {}
      }
    })();
  </script>

    .call-link {

      font-weight: 700;

    .call-link svg {

    /* Return home */

    .home-link svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .home-link:hover { color: #9ca3af; }
  </style>
