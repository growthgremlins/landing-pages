<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f5f5f5;
    --line: #e5e5e5;
    --ink: #0a0a0a;
    --ink-2: #4a5568;
    --ink-3: #8b8d8f;
    --sand: #dc2626;
    --sand-deep: #b91c1c;
    --success: #2d7d5e;
    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --radius: 12px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    font-size: 16px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .nav {
    background: rgba(255,255,255,0.96);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top, 0px);
  }
  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 18px 28px;
    display: flex;
    justify-content: center;
  }
  .logo img { height: 44px; width: auto; object-fit: contain; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .card {
    max-width: 520px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 48px 36px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(10,10,10,0.06);
  }

  .check {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #e9f5ef;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check svg { width: 36px; height: 36px; stroke: var(--success); }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  .lead {
    color: var(--ink-2);
    font-size: 16px;
    margin-bottom: 32px;
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 0 auto 28px;
    max-width: 220px;
  }

  .contact-label {
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    margin-bottom: 10px;
  }

  .phone {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--sand);
    color: #fff;
    padding: 14px 26px;
    border-radius: var(--radius-sm);
    font-size: 20px;
    font-weight: 600;
    transition: background 0.2s, transform 0.1s;
  }
  .phone:hover { background: var(--sand-deep); }
  .phone:active { transform: scale(0.98); }
  .phone svg { width: 20px; height: 20px; }

  .hours {
    margin-top: 22px;
    font-size: 14px;
    color: var(--ink-3);
  }

  .back {
    margin-top: 28px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .back:hover { color: var(--ink); }

  @media (max-width: 520px) {
    .card { padding: 40px 24px; }
    h1 { font-size: 24px; }
  }
</style>

  </div>
</nav>

<main>
  <div class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <h1>Thank you for booking!</h1>
    <p class="lead">Your detailing appointment is confirmed. We'll text you a confirmation shortly with all the details.</p>

    <div class="divider"></div>

    <div class="contact-label">Questions? Give us a call</div>
    <a href="tel:+17578297713" class="phone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
      (757) 829-7713
    </a>

    <p class="hours">Mon–Sat · 8am–6pm · Chesapeake, VA</p>

    <a href="./index.html" class="back">&larr; Back to home</a>
  </div>
</main>
